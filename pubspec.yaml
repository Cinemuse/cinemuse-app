name: cinemuse_app
description: "Cinemuse App - Your personal cinema guide."
publish_to: 'none'

# Set by CI from the git tag (--build-name / --build-number).
version: 1.0.0

environment:
  sdk: ^3.11.0

# Supported platforms: Android, Windows, Linux.
dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.0.9
  media_kit_libs_android_video: ^1.3.6
  cast: ^2.1.0
  flutter_riverpod: ^2.6.1
  dio: ^5.9.1
  shared_preferences: ^2.5.3
  riverpod_annotation: ^2.6.1
  supabase_flutter: ^2.12.0
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  stack_trace: ^1.12.1
  url_launcher: ^6.3.2
  lucide_icons: ^0.257.0
  cached_network_image: ^3.4.1
  youtube_explode_dart: ^3.0.5
  ota_update: ^7.1.0
  package_info_plus: ^8.1.1
  window_manager: ^0.4.3
  flutter_markdown: ^0.7.5
  connectivity_plus: ^7.0.0
  drift: ^2.28.2
  sqlite3: ^2.4.2
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  archive: ^3.6.1
  path: ^1.9.1
  uuid: ^4.5.3
  file_picker: ^11.0.2
  html: ^0.15.6
  equatable: ^2.0.8
  timeago: ^3.7.1
  wakelock_plus: ^1.3.3
  vector_math: ^2.1.4
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.28.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/sports/
    - .env

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/lora.ttf
          style: italic
    - family: Fira Code
      fonts:
        - asset: assets/fonts/firacode.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256

dependency_overrides:
  # `cast` accepts any bonsoir >= 3.0.0. Pinned to 5.0.1, the version casting
  # was last tested with. Re-test casting before changing it.
  bonsoir: 5.0.1
  # Local copy of media_kit_video 2.0.1 with Linux-only fixes in
  # `linux/texture_gl.cc` and `linux/video_output.cc`: EGL/GLX context handling
  # (Flutter 3.38+ no longer has its EGL context current on the platform
  # thread). Dart code is unchanged from upstream. Drop the override once
  # upstream ships the same fix.
  media_kit_video:
    path: packages/media_kit_video
